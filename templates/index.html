{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Patient Medical Information</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/predict" id="predictionForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Age (years)</label>
                            <input type="number" class="form-control" name="age" 
                                   min="1" max="120" value="50" required>
                            <small class="text-muted">Range: 1-120 years</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Sex</label>
                            <select class="form-select" name="sex" required>
                                <option value="0">Female</option>
                                <option value="1">Male</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Chest Pain Type</label>
                        <select class="form-select" name="cp" required>
                            <option value="0">Typical Angina</option>
                            <option value="1">Atypical Angina</option>
                            <option value="2">Non-anginal Pain</option>
                            <option value="3">Asymptomatic</option>
                        </select>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Resting Blood Pressure (mm Hg)</label>
                            <input type="number" class="form-control" name="trestbps" 
                                   min="80" max="250" value="120" required>
                            <small class="text-muted">Normal: 90-120 mm Hg</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cholesterol (mg/dL)</label>
                            <input type="number" class="form-control" name="chol" 
                                   min="100" max="600" value="200" required>
                            <small class="text-muted">Normal: &lt;200 mg/dL</small>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Fasting Blood Sugar > 120 mg/dL</label>
                            <select class="form-select" name="fbs" required>
                                <option value="0">False</option>
                                <option value="1">True</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Resting ECG</label>
                            <select class="form-select" name="restecg" required>
                                <option value="0">Normal</option>
                                <option value="1">ST-T Wave Abnormality</option>
                                <option value="2">Left Ventricular Hypertrophy</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Maximum Heart Rate</label>
                            <input type="number" class="form-control" name="thalach" 
                                   min="60" max="250" value="150" required>
                            <small class="text-muted">Range: 60-250 bpm</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Exercise Induced Angina</label>
                            <select class="form-select" name="exang" required>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Oldpeak (ST Depression)</label>
                            <input type="number" step="0.1" class="form-control" 
                                   name="oldpeak" min="0" max="10" value="1.0" required>
                            <small class="text-muted">Range: 0.0-10.0</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Slope</label>
                            <select class="form-select" name="slope" required>
                                <option value="0">Upsloping</option>
                                <option value="1">Flat</option>
                                <option value="2">Downsloping</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Number of Major Vessels</label>
                            <input type="number" class="form-control" name="ca" 
                                   min="0" max="4" value="0" required>
                            <small class="text-muted">Range: 0-4</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Thalassemia</label>
                            <select class="form-select" name="thal" required>
                                <option value="0">Unknown</option>
                                <option value="1">Normal</option>
                                <option value="2">Fixed Defect</option>
                                <option value="3">Reversible Defect</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            🔍 Predict Heart Disease
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div id="resultContainer" class="mt-4" style="display: none;">
            <div class="alert" id="resultAlert">
                <h4 id="resultTitle"></h4>
                <p id="resultMessage"></p>
                <div class="progress">
                    <div id="probabilityBar" class="progress-bar" role="progressbar" 
                         style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('predictionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    try {
        const response = await fetch('/predict', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            const resultDiv = document.getElementById('resultContainer');
            const alertDiv = document.getElementById('resultAlert');
            const title = document.getElementById('resultTitle');
            const message = document.getElementById('resultMessage');
            const bar = document.getElementById('probabilityBar');
            
            resultDiv.style.display = 'block';
            
            if (result.prediction === 1) {
                alertDiv.className = 'alert alert-danger';
                title.textContent = '⚠️ HIGH RISK: Heart Disease Detected';
                message.textContent = `Probability: ${(result.probability * 100).toFixed(2)}% - Please consult a cardiologist immediately.`;
                bar.className = 'progress-bar bg-danger';
            } else {
                alertDiv.className = 'alert alert-success';
                title.textContent = '✅ LOW RISK: No Heart Disease Detected';
                message.textContent = `Probability: ${(result.probability * 100).toFixed(2)}% - Maintain a healthy lifestyle.`;
                bar.className = 'progress-bar bg-success';
            }
            
            bar.style.width = `${result.probability * 100}%`;
            bar.textContent = `${(result.probability * 100).toFixed(2)}%`;
            
            // Scroll to result
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        } else {
            alert('Error: ' + result.error);
        }
    } catch (error) {
        alert('Network error: ' + error.message);
    }
});
</script>
{% endblock %}
